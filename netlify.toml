# Cấu hình Netlify cho MXHKNCD (Next.js).
# Netlify tự nhận diện Next.js và xử lý routing — không cần SPA redirect.

[build]
  base = "frontend"
  # npm ci cài sạch dependencies mỗi lần build — tránh lỗi cache hỏng
  # (ví dụ: Cannot find module react.production.js)
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "22"

# Sau khi deploy backend (Render/Railway/Fly.io), đặt biến môi trường
# NEXT_PUBLIC_API_URL=https://backend-cua-ban.onrender.com trên Netlify.
# Hoặc bỏ comment 2 dòng dưới (thay URL backend của bạn) để Netlify proxy /api:
# [[redirects]]
#   from = "/api/*"
#   to = "https://backend-cua-ban.onrender.com/api/:splat"
#   status = 200
